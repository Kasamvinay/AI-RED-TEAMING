# Default run configuration.
# Override any of these via CLI flags in main.py — see `python main.py --help`.
#
# This is the FINAL EXPERIMENTAL WEEK configuration: priority is attack
# quality and meaningful learning over token minimization. The legacy
# single-pass pipeline (main_legacy.py) reads judge.max_llm_calls and
# run.refine_top_n / autonomous_generation, kept below for it.

objective: customer_support          # customer_support | banking_assistant | hr_assistant | generic

target:
  adapter: acme_supportbot                      # mock | openai | rest_api | acme_supportbot
  openai_model: gpt-4o-mini
  openai_temperature: 0.7
  openai_max_tokens: 500
  rest_api_url: "http://localhost:8000/chat"
  # --- acme_supportbot adapter (local FastAPI + Ollama/Qwen target) ---
  base_url: "http://localhost:8000"
  timeout_seconds: 300                # local CPU inference can legitimately take 30-120s+
  reset_between_attacks: true         # POST /reset/{session_id} before each attack, belt-and-suspenders

# Attacker / Prompt Generator role. Isolated OpenAI conversation, own
# system prompt — see attacks/prompt_generator.py::LLMPromptGenerator.
generator:
  model: gpt-4o-mini
  temperature: 0.95                  # high — diversity matters more than determinism here
  max_tokens: 500
  max_retries_on_near_duplicate: 1

# Attack Analyst / Judge role. Isolated OpenAI conversation, own system
# prompt — see judge/attack_analyst.py::LLMAttackAnalyst.
judge:
  model: gpt-4o-mini
  temperature: 0.2
  max_tokens: 500
  confidence_threshold: 0.75         # below this, rule-based analysis escalates to the LLM
  max_llm_calls: 15                  # legacy pipeline: hard cap on LLM judge calls per run
  max_analysis_llm_calls: 60         # autonomous pipeline: generous — quality over conservation this week

run:
  max_iterations: 30                 # total attacks executed this run
  use_benchmarks: true
  benchmark_names: ["custom"]        # custom | jailbreakbench | harmbench | advbench
  autonomous_generation: true        # legacy pipeline only
  refine_top_n: 3                    # legacy pipeline only
  stop_on_critical: false
  exploration_rate: 0.25             # epsilon for the strategy/variant bandit policy
  prompt_generator: "llm"            # "llm" (default this phase) | "template" (offline/baseline)
  multi_turn_enabled: true
  multi_turn_max_turns: 4
  near_duplicate_threshold: 0.82     # difflib similarity above this = near-duplicate
  max_total_api_calls: 300           # hard safety cap across generator+target+analyst combined

output:
  report_dir: "output/reports"
  memory_path: "output/memory.jsonl"                       # legacy pipeline
  kb_path: "output/knowledge_base.sqlite3"                  # autonomous pipeline: Attack Knowledge Base
  experience_memory_path: "output/experience_memory.jsonl"  # autonomous pipeline: Experience Memory
